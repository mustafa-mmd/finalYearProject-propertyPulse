<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#shine)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />
  
  <g filter="url(#shadow)">
    <!-- Base House -->
    <path d="M256 120 L410 260 L360 260 L360 400 L290 400 L290 310 L222 310 L222 400 L152 400 L152 260 L102 260 Z" fill="#ffffff" />
    <!-- Pulse Line over it -->
    <path d="M 160 250 L 210 250 L 235 180 L 275 330 L 305 250 L 350 250" fill="none" stroke="#4f46e5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
